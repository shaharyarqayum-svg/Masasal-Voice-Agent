<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#334155" stroke-width="3" opacity="0.6" />
  <!-- Waveform bars -->
  <g fill="url(#waveGrad)" filter="url(#glow)">
    <rect x="96" y="220" width="20" height="72" rx="10" />
    <rect x="136" y="170" width="20" height="172" rx="10" />
    <rect x="176" y="120" width="20" height="272" rx="10" />
    <rect x="216" y="80" width="20" height="352" rx="10" />
    <rect x="256" y="150" width="20" height="212" rx="10" />
    <rect x="296" y="100" width="20" height="312" rx="10" />
    <rect x="336" y="140" width="20" height="232" rx="10" />
    <rect x="376" y="190" width="20" height="132" rx="10" />
    <rect x="416" y="230" width="20" height="52" rx="10" />
  </g>
</svg>
