name: Foundation verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: TypeScript check
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Existing smoke tests
        run: npx tsx tests/smoke_tests.ts
